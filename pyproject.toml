[project]
name = "pokemon-champions-agents"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.5.1",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
ollama = [
    "langchain-ollama>=1.1.0",
]
anthropic = [
    "langchain-anthropic>=0.3",
]
laya = [
    "laya>=0.3,<0.4",
]

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recommender*"]

[tool.pytest.ini_options]
testpaths = [
    "tests/recommender",
    "tests/ci",
    # FU70: tool_fixes_v2 + harness start-state (#322/#323); keep as files so the
    # rest of scripts/eval/part_g_arm/state is not pulled into the default suite.
    "scripts/eval/part_g_arm/state/test_tool_fixes_v2.py",
    "scripts/eval/part_g_arm/state/test_harness_start_state_fu70.py",
    "scripts/eval/part_g_arm/state/test_ix_facts_fu74_drift.py",
    "scripts/eval/part_g_arm/state/test_fu74_revised_arm.py",
    "scripts/eval/part_g_arm/state/test_fu74_parser_prompt_cut.py",
]
pythonpath = [".", "tests/recommender"]
