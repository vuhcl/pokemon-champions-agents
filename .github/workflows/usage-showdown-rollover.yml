name: usage-showdown-rollover

on:
  schedule:
    # Daily Showdown monthly chaos rollover (owed pairs + overdue alarm).
    - cron: "07 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Skip DROP_RATIO, overdue soft-path, and short-over-full gate (integrity still required)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: usage-showdown-rollover
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync --extra dev --frozen

      - name: Showdown owed-pair rollover
        id: gate
        run: |
          set -uo pipefail
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          set +e
          uv run python -m scripts.ci.usage_showdown_rollover $FORCE_FLAG
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"

      - name: Commit showdown snapshot to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Showdown per-source files only — never touch ingame.
          git add data/usage/*.showdown_doubles.v1.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: roll Showdown chaos into showdown_doubles usage"
          bash scripts/ci/push_to_main.sh

      - name: Propagate rollover exit code
        env:
          ROLLOVER_EXIT: ${{ steps.gate.outputs.exit_code }}
        run: |
          if [ "${ROLLOVER_EXIT}" != "0" ]; then
            echo "rollover failed with exit ${ROLLOVER_EXIT} (overdue or integrity)"
            exit "${ROLLOVER_EXIT}"
          fi
